[pytest]
# Without this, `pytest tests/...` (as run by .github/workflows/quality-gate.yml)
# fails every test module with `ModuleNotFoundError: No module named 'app'`.
#
# Root cause: this directory has no conftest.py, and pytest's default
# "prepend" import mode only adds the first ancestor directory *without* an
# __init__.py to sys.path -- since tests/ has no __init__.py, that's
# tests/ itself, not backend/ (which is what actually needs to be on
# sys.path for `from app...` imports to resolve). Running `python -m pytest`
# masks this locally because `-m` auto-prepends the current working
# directory to sys.path, which the CI workflow's plain `pytest ...`
# invocation does not do. Confirmed live 2026-09-01: quality-gate's
# "backend" job failed with this exact ModuleNotFoundError on both
# tests/test_dlpd_semantics.py and tests/test_etl_recovery_safety.py.
#
# `pythonpath` (pytest >= 7.0) adds this directory to sys.path before
# collection regardless of how pytest is invoked or what the caller's cwd
# is, which is the actual fix rather than relying on invocation style.
pythonpath = .
